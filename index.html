<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coming Soon | Omar Adeel</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #2f81f7;
        --border: #30363d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
        background: radial-gradient(circle at 20% 20%, #1f2937 0%, var(--bg) 45%);
        color: var(--text);
      }

      .card {
        width: min(760px, 100%);
        background: linear-gradient(180deg, #1b2230 0%, var(--panel) 100%);
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      }

      .terminal-bar {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.9rem 1rem;
        border-bottom: 1px solid var(--border);
        background: #0f141c;
      }

      .dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
      }

      .dot.red {
        background: #f85149;
      }

      .dot.yellow {
        background: #d29922;
      }

      .dot.green {
        background: #3fb950;
      }

      .path {
        margin-left: 0.55rem;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .content {
        padding: 2rem 1.2rem 2.2rem;
      }

      .line {
        color: var(--muted);
        margin: 0 0 0.9rem;
      }

      h1 {
        margin: 0 0 0.7rem;
        font-size: clamp(1.5rem, 5vw, 2.4rem);
        line-height: 1.2;
      }

      p {
        margin: 0.4rem 0;
        color: #c9d1d9;
      }

      .accent {
        color: var(--accent);
      }

      .cursor {
        display: inline-block;
        width: 0.55ch;
        margin-left: 0.15rem;
        background: var(--accent);
        animation: blink 1s steps(1, end) infinite;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      @media (min-width: 640px) {
        .content {
          padding: 2.5rem 2rem 2.6rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="terminal-bar">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <span class="path">omaaradeel.github.io ~ main</span>
      </div>
      <section class="content" aria-label="Coming soon message">
        <p class="line">$ npm run launch-portfolio</p>
        <h1><span class="accent">Coming Soon</span> — Building Something Great</h1>
        <p>Engineer mode is active.</p>
        <p>Crafting a clean, fast, and developer-focused experience.</p>
        <p class="line">$ status: <span class="accent">in progress</span><span class="cursor"></span></p>
      </section>
    </main>
  </body>
</html>
