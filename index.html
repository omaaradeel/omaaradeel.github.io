<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coming Soon | Omar Adeel</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #2f81f7;
        --border: #30363d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
        background: radial-gradient(circle at 20% 20%, #1f2937 0%, var(--bg) 45%);
        color: var(--text);
        overflow: hidden;
      }

      .card {
        width: min(760px, 100%);
        background: linear-gradient(180deg, #1b2230 0%, var(--panel) 100%);
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        opacity: 0;
        transform: translateY(24px) scale(0.985);
        animation: cardEnter 0.9s ease-out 1.1s forwards, cardFloat 6s ease-in-out 2.2s infinite;
      }

      .terminal-bar {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.9rem 1rem;
        border-bottom: 1px solid var(--border);
        background: #0f141c;
      }

      .dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        animation: dotPulse 2.2s ease-in-out infinite;
      }

      .dot.red {
        background: #f85149;
      }

      .dot.yellow {
        background: #d29922;
      }

      .dot.green {
        background: #3fb950;
        animation-delay: 0.4s;
      }

      .path {
        margin-left: 0.55rem;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .content {
        padding: 2rem 1.2rem 2.2rem;
      }

      .line {
        color: var(--muted);
        margin: 0 0 0.9rem;
      }

      h1 {
        margin: 0 0 0.7rem;
        font-size: clamp(1.5rem, 5vw, 2.4rem);
        line-height: 1.2;
        animation: titleGlow 3.5s ease-in-out 2s infinite;
      }

      p {
        margin: 0.4rem 0;
        color: #c9d1d9;
      }

      .accent {
        color: var(--accent);
      }

      .cursor {
        display: inline-block;
        width: 0.55ch;
        margin-left: 0.15rem;
        background: var(--accent);
        animation: blink 1s steps(1, end) infinite;
      }

      .line-animated {
        opacity: 0;
        transform: translateY(10px);
        animation: fadeUp 0.6s ease-out forwards;
      }

      .line-1 {
        animation-delay: 1.25s;
      }

      .line-2 {
        animation-delay: 1.4s;
      }

      .line-3 {
        animation-delay: 1.55s;
      }

      .line-4 {
        animation-delay: 1.7s;
      }

      .line-5 {
        animation-delay: 1.85s;
      }

      .splash-screen {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 30% 20%, #1f2937 0%, #0b0f14 60%);
        z-index: 20;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }

      .splash-screen.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .splash-content {
        text-align: center;
      }

      .loader-ring {
        width: 58px;
        height: 58px;
        margin: 0 auto 1rem;
        border: 3px solid rgba(139, 148, 158, 0.35);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      .splash-title {
        margin: 0 0 0.4rem;
        font-size: 1.1rem;
        letter-spacing: 0.01em;
      }

      .splash-subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 0.88rem;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes cardEnter {
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes cardFloat {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }

      @keyframes dotPulse {
        0%,
        100% {
          opacity: 0.8;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.08);
        }
      }

      @keyframes titleGlow {
        0%,
        100% {
          text-shadow: 0 0 0 rgba(47, 129, 247, 0);
        }
        50% {
          text-shadow: 0 0 14px rgba(47, 129, 247, 0.28);
        }
      }

      @keyframes fadeUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (min-width: 640px) {
        .content {
          padding: 2.5rem 2rem 2.6rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="splash-screen" id="splash-screen" aria-label="Loading screen">
      <div class="splash-content">
        <div class="loader-ring" aria-hidden="true"></div>
        <p class="splash-title"><span class="accent">Booting Portfolio</span></p>
        <p class="splash-subtitle">$ initializing software engineer workspace...</p>
      </div>
    </div>
    <main class="card">
      <div class="terminal-bar">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <span class="path">omaaradeel.github.io ~ main</span>
      </div>
      <section class="content" aria-label="Coming soon message">
        <p class="line line-animated line-1">$ npm run launch-portfolio</p>
        <h1><span class="accent">Coming Soon</span> — Building Something Great</h1>
        <p class="line-animated line-2">Engineer mode is active.</p>
        <p class="line-animated line-3">Crafting a clean, fast, and developer-focused experience.</p>
        <p class="line line-animated line-4">$ animations: <span class="accent">enabled</span></p>
        <p class="line line-animated line-5">$ status: <span class="accent">in progress</span><span class="cursor"></span></p>
      </section>
    </main>
    <script>
      const splashScreen = document.getElementById("splash-screen");
      const hideSplash = () => splashScreen.classList.add("hidden");
      setTimeout(hideSplash, 1150);
      window.addEventListener("load", hideSplash);
    </script>
  </body>
</html>
